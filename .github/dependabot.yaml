version: 2
updates:
  # GitHub Actions updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      actions:
        patterns:
          - '*'

  # Dependency updates
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # ignore all patch upgrades
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
      # telescope 2.x generates code for the InterchainJS ecosystem rather than
      # cosmjs, which is what this package exists to serve, so a major bump is
      # not an upgrade for us. Revisit only as a deliberate migration.
      - dependency-name: '@cosmology/telescope'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 10
    versioning-strategy: increase
    pull-request-branch-name:
      separator: '-'
    groups:
      # Telescope generates everything under src/, so its updates arrive on
      # their own: they need `pnpm build` and a review of the regenerated diff.
      telescope:
        patterns:
          - '@cosmology/*'
      cosmjs:
        patterns:
          - '@cosmjs/*'
      types:
        patterns:
          - '@types/*'
      everything-else:
        patterns:
          - '*'
