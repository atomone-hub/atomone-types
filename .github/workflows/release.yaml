name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance and trusted publishing.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install modules
        run: pnpm install --frozen-lockfile

      # The version is maintained by hand, so a mistyped tag would publish the
      # wrong version under the right name.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      # --no-git-checks: the tag is already checked above, and pnpm otherwise
      # refuses to publish from a detached tag checkout.
      - name: Publish
        run: pnpm publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          # Unset when the package uses a Trusted Publisher on npm, which is
          # what id-token above is for.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
