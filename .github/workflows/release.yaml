name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance and trusted publishing.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Node 24 ships an npm new enough for trusted publishing (>= 11.5.1).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install modules
        run: npm ci

      # The version is maintained by hand, so a mistyped tag would publish the
      # wrong version under the right name.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          # Unset when the package uses a Trusted Publisher on npm, which is
          # what id-token above is for.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
